<!doctype html><html lang="vi" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/app.css">
<style>
/* Ảnh OG 1200×630 cho một nhóm (scripts/make-brand.js mở trang này với ?id=<nhóm>&lang=vi|en):
   dải nền nhuộm màu chuyên mục như đầu trang công cụ, gạch trên màu nhóm, ô icon lớn, tên nhóm, câu quyền riêng tư tô dạ quang */
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{--band:color-mix(in oklab,var(--c) 13%,#FBF8F1);--ink:color-mix(in oklab,var(--c) 14%,#1E170A);--muted:color-mix(in oklab,var(--c) 24%,#4A4234);--tab:color-mix(in oklab,var(--c) 76%,#000);
  background:var(--band);color:var(--ink);font-family:"Be Vietnam Pro",sans-serif;border-top:14px solid var(--c);box-sizing:border-box;display:block;min-height:0}
.wrapx{position:absolute;inset:14px 0 0 0;padding:58px 72px 60px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:center}
.brand{position:absolute;left:72px;bottom:52px;display:flex;align-items:center;gap:14px;font:800 36px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;color:#241C0E}
.brand svg{width:54px;height:54px}.brand b{color:#8A5A06}
.txt{align-self:start;padding-top:18px}
h1{font:800 74px/1.04 "Bricolage Grotesque",sans-serif;letter-spacing:-.035em;margin:0;color:var(--ink);text-wrap:balance}
.desc{margin:22px 0 0;font-size:26px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:690px}
.desc.long{font-size:21px;-webkit-line-clamp:5}
.priv{position:absolute;left:72px;right:420px;bottom:124px;margin:0;font-size:23px;font-weight:600;line-height:1.5;color:#2B1E08}
.priv b{background:#FFF4CC;padding:.06em .3em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.big{width:300px;height:300px;border-radius:72px;background:var(--c);display:grid;place-items:center;color:#fff;box-shadow:0 30px 60px -28px rgba(60,40,8,.55)}
.big svg{width:150px;height:150px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.count{position:absolute;right:72px;bottom:56px;width:300px;text-align:center;font-size:24px;font-weight:700;color:var(--muted)}
</style></head><body>
<div class="wrapx"><div class="txt"><h1 id="t"></h1><p class="desc" id="d"></p></div><div class="big"><svg><use id="ic" href=""/></svg></div></div>
<p class="priv" id="p"></p>
<p class="count" id="n"></p>
<div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#8A5A06"/><path d="M10 7.5h7.2c3.3 0 5.4 1.8 5.4 4.5 0 1.9-1 3.2-2.6 3.8 2.1.5 3.5 2.1 3.5 4.3 0 3.1-2.4 5.1-6 5.1H10z" fill="#fff"/><path d="M14.2 11v3.6h2.6c1.3 0 2-.7 2-1.8s-.7-1.8-2-1.8zm0 6.9v4h3c1.5 0 2.3-.8 2.3-2s-.8-2-2.3-2z" fill="#8A5A06"/><circle cx="25.5" cy="7" r="2.6" fill="#FFC53D"/></svg><span>Bbe<b>Tools</b></span></div>
<script type="module">
const q = new URLSearchParams(location.search), id = q.get("id"), en = q.get("lang") === "en";
const reg = await import(en ? "../../assets/en/registry.js" : "../../assets/registry.js");
const g = reg.groups.find((x) => x.id === id);
const n = reg.tools.filter((t) => t.group === id).length;
const desc = (await (await fetch("../../" + (en ? "i18n/en/tools.json" : "tools.json"))).json());
const gd = en ? desc.groups[id] : desc.groups.find((x) => x.id === id);
document.documentElement.lang = en ? "en" : "vi";
document.body.style.setProperty("--c", g.color);
document.getElementById("t").textContent = en ? `${g.name} tools` : `Công cụ ${g.name}`;
const dEl = document.getElementById("d");
dEl.textContent = gd.desc;
dEl.classList.toggle("long", gd.desc.length > 130);
document.getElementById("ic").setAttribute("href", "../../assets/icons.svg#" + g.icon);
document.getElementById("n").textContent = en ? `${n} tools` : `${n} công cụ`;
document.getElementById("p").innerHTML = en ? "Runs right in your browser:<br><b>your files never leave your device</b>" : "Chạy ngay trên trình duyệt:<br><b>file không bao giờ rời khỏi máy bạn</b>";
await document.fonts.ready;
document.body.dataset.ready = "1";
</script>
</body></html>
