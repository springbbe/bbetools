<!doctype html><html lang="vi" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/app.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F6F7F9;font-family:"Be Vietnam Pro",sans-serif;color:#16181D}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.brand{color:#16181D;display:flex;align-items:center;gap:22px;font-size:58px;font-weight:800;letter-spacing:-.02em}.brand img{width:92px;height:92px}.brand b{color:#3E5BF2}
h1{font-size:64px;line-height:1.12;margin:0;letter-spacing:-.03em;font-weight:800;max-width:900px}
p{font-size:30px;margin:0;color:#18794E;font-weight:600}
.tiles{position:absolute;right:70px;top:70px;display:grid;grid-template-columns:repeat(3,96px);gap:18px}
.t{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;color:#fff}.t svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="tiles">
<span class="t" style="background:#E5484D"><svg><use href="../../assets/icons.svg#combine"/></svg></span>
<span class="t" style="background:#8E4EC6"><svg><use href="../../assets/icons.svg#image-down"/></svg></span>
<span class="t" style="background:#C27C0E"><svg><use href="../../assets/icons.svg#landmark"/></svg></span>
<span class="t" style="background:#475569"><svg><use href="../../assets/icons.svg#qr-code"/></svg></span>
<span class="t" style="background:#0D74CE"><svg><use href="../../assets/icons.svg#whole-word"/></svg></span>
<span class="t" style="background:#5C8A1C"><svg><use href="../../assets/icons.svg#timer"/></svg></span>
</div>
<div class="wrap">
<div class="brand"><img src="../../assets/favicon.svg" alt=""><span>Bbe<b>Tools</b></span></div>
<div><h1>Công cụ tiện ích miễn phí cho người Việt</h1></div>
<p>🔒 Chạy ngay trên trình duyệt — file không bao giờ rời khỏi máy bạn</p>
</div>
</body></html>
