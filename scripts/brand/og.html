<!doctype html><html lang="vi" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/app.css">
<style>
/* Ảnh OG 1200×630 theo giao diện "Vàng đất": khối vàng đất như trang chủ, tiêu đề nâu đất, cụm quyền riêng tư tô dạ quang, nhãn nhóm màu chuyên mục */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#D6A23A;color:#2B1E08;font-family:"Be Vietnam Pro",sans-serif}
.l{position:absolute;left:72px;top:64px;bottom:64px;width:560px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px;font:800 50px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.brand svg{width:76px;height:76px}.brand b{color:#5A3C06}
h1{font:800 76px/1.04 "Bricolage Grotesque",sans-serif;letter-spacing:-.035em;margin:0}
p{margin:0;font-size:27px;line-height:1.5;color:#4A3511;font-weight:600;display:flex;gap:14px;align-items:flex-start}
p svg{flex:0 0 34px;width:34px;height:34px;margin-top:4px;fill:none;stroke:#17784C;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
p b{background:#FFF4CC;color:#2B1E08;padding:.04em .3em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cats{position:absolute;right:64px;top:72px;bottom:72px;width:470px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:14px;list-style:none;margin:0;padding:0}
.cats li{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:0 16px;box-shadow:0 2px 3px rgba(0,0,0,.08),0 10px 22px -14px rgba(0,0,0,.4);font-weight:700;font-size:21px;line-height:1.2}
.t{flex:0 0 54px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff}
.t svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="l">
<div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#8A5A06"/><path d="M10 7.5h7.2c3.3 0 5.4 1.8 5.4 4.5 0 1.9-1 3.2-2.6 3.8 2.1.5 3.5 2.1 3.5 4.3 0 3.1-2.4 5.1-6 5.1H10z" fill="#fff"/><path d="M14.2 11v3.6h2.6c1.3 0 2-.7 2-1.8s-.7-1.8-2-1.8zm0 6.9v4h3c1.5 0 2.3-.8 2.3-2s-.8-2-2.3-2z" fill="#8A5A06"/><circle cx="25.5" cy="7" r="2.6" fill="#FFC53D"/></svg><span>Bbe<b>Tools</b></span></div>
<h1>Công cụ tiện ích cho người Việt</h1>
<p><svg><use href="../../assets/icons.svg#shield-check"/></svg><span>Miễn phí, chạy ngay trên trình duyệt:<br><b>file không bao giờ rời khỏi máy bạn</b></span></p>
</div>
<ul class="cats">
<li><span class="t" style="background:#E5484D"><svg><use href="../../assets/icons.svg#file-text"/></svg></span>PDF</li>
<li><span class="t" style="background:#8E4EC6"><svg><use href="../../assets/icons.svg#image"/></svg></span>Ảnh</li>
<li><span class="t" style="background:#C27C0E"><svg><use href="../../assets/icons.svg#flag"/></svg></span>Tiện ích Việt Nam</li>
<li><span class="t" style="background:#475569"><svg><use href="../../assets/icons.svg#qr-code"/></svg></span>QR &amp; mã vạch</li>
<li><span class="t" style="background:#0D74CE"><svg><use href="../../assets/icons.svg#type"/></svg></span>Văn bản</li>
<li><span class="t" style="background:#E5701A"><svg><use href="../../assets/icons.svg#calculator"/></svg></span>Tính toán</li>
</ul>
</body></html>
